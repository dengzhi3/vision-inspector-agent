[project]
name = "vision-inspector-agent"
version = "0.1.0"
description = "YOLOv8 视觉检测：模型加载、预测、配置与结果结构拆分练习"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dill>=0.4.1",
    "efficientnet-pytorch>=0.7.1",
    "einops>=0.8.2",
    "pandas>=3.0.5",
    "py-cpuinfo>=9.0.0",
    "pywavelets>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "timm>=1.0.28",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.118",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"
norecursedirs = [
    ".venv",
    "ultralytics",
    "outputs",
    "models",
]
